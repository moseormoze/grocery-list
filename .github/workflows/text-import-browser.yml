name: Shared text import
on:
  pull_request:
    paths:
      - 'app/lists/**'
      - 'app/api/items/**'
      - 'components/*Import*'
      - 'components/SortableGroceryItem.tsx'
      - 'lib/text-import/**'
      - 'lib/db/**'
      - 'hooks/useList.ts'
      - 'scripts/test-text-import-browser.mjs'
      - '.github/workflows/text-import-browser.yml'
permissions:
  contents: read
jobs:
  shared-list:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - name: Start an ephemeral Supabase project
        run: |
          supabase init
          supabase start -x studio,analytics,vector,edge-runtime,imgproxy,storage-api,inbucket,supavisor,postgres-meta
          supabase status -o env > "$RUNNER_TEMP/local-supabase.env"
          source "$RUNNER_TEMP/local-supabase.env"
          psql "$DB_URL" --set=ON_ERROR_STOP=1 --file=lib/db/schema.sql
          psql "$DB_URL" -c "notify pgrst, 'reload schema'"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "TEST_SERVICE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      - name: Verify the build and start the application
        run: |
          npm test -- --run
          npm run build
          npm start > "$RUNNER_TEMP/grocery-next.log" 2>&1 &
          for i in {1..60}; do curl -fsS http://localhost:3000/logo.svg > /dev/null && exit 0; sleep 1; done
          exit 1
      - name: Exercise two authenticated mobile browser sessions
        run: |
          npm install --prefix "$RUNNER_TEMP/grocery-browser" playwright@1.56.1
          "$RUNNER_TEMP/grocery-browser/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/grocery-browser/node_modules/playwright/index.mjs" node scripts/test-text-import-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-shopping-import
          path: |
            ${{ runner.temp }}/shopping-import-*.png
          if-no-files-found: ignore
