<main class="workbench">
<aside class="notes">
  <div class="eyebrow">רשימת הקניות שלנו · מוקאפ עם נתוני דוגמה</div>
  <h1>מהטקסט שלכם.<br>לרשימה של שניכם.</h1>
  <p class="intro">מדביקים, בודקים ומוסיפים.<br>כל מוצר עם השם, הכמות והמקום שלו ברשימה.</p>
  <nav class="steps" aria-label="מסכי ההדגמה">
    <button class="step" data-screen="list"><span class="step-num">01</span><span><strong>מתחילים ברשימה</strong><small>פעולה קטנה ליד כפתור ההעתקה</small></span></button>
    <button class="step" data-screen="input"><span class="step-num">02</span><span><strong>מכניסים את הטקסט</strong><small>הדבקה, הקלדה או הכתבה מהמקלדת</small></span></button>
    <button class="step" data-screen="review"><span class="step-num">03</span><span><strong>בודקים לפני שמוסיפים</strong><small>מתקנים כמויות ובוחרים מה ייכנס</small></span></button>
    <button class="step" data-screen="success"><span class="step-num">04</span><span><strong>הכול במקום</strong><small>מסווג, משותף ועם חיווי מקור עדין</small></span></button>
  </nav>
  <div class="design-note"><b>מוקאפ אינטראקטיבי, עם נתוני דוגמה.</b><br>אפשר לבחור פריטים, לערוך ולסמן כנקנה. הפענוח מדומה ופועל על הדוגמה המוכנה בלבד. דבר לא נשלח או נשמר ברשימה האמיתית.
    <div class="scenarios"><button data-scenario="error">שגיאת פענוח</button><button data-scenario="empty">לא נמצאו פריטים</button><button data-scenario="reset">איפוס ההדגמה</button></div>
  </div>
  <nav class="mobile-nav" aria-label="מסכי המוקאפ"><button data-screen="list">רשימה</button><button data-screen="input">הזנה</button><button data-screen="review">בדיקה</button><button data-screen="success">אחרי הוספה</button></nav>
</aside>

<script>

function duplicateFor(row){return items.find(i=>!i.done&&norm(i.name)===norm(row.name))}

function renderList(fresh=false){
  const done=items.filter(i=>i.done).length
  $('#app').innerHTML=`<div class="status" aria-hidden="true"><span>9:41</span><span class="status-icons">${icon('signal')}${icon('battery')}</span></div>
    <header class="app-header"><button class="icon" data-demo="זהו מסך הרשימה במוקאפ" aria-label="חזרה לרשימות">${icon('arrow')}</button><div class="title-wrap">${icon('cart')}<h2>קניות לבית</h2></div><button id="import-button" class="icon" title="הוסף מטקסט" aria-label="הוסף מטקסט">${icon('import')}</button><button class="icon" id="copy-button" title="העתק רשימה" aria-label="העתק רשימה">${icon('copy')}</button><button class="edit-top" data-demo="עריכת הפריטים החדשים זמינה במסך הבדיקה">ערוך</button></header>
    <div class="list-content"><div class="list-summary"><span>${done} מתוך ${items.length} נקנו</span><span class="partner"><span class="dot"></span>משותפת לשניכם</span></div>
    ${Object.entries(cats).map(([id,cat])=>{
      const group=items.filter(i=>i.cat===id)
      if(!group.length)return ''
      return `<section class="category"><h3 class="category-head" style="background:${cat.tint};color:${cat.ink}"><span>${cat.name}</span>${icon(cat.icon)}</h3>${group.map(i=>`<div class="item ${i.done?'done':''} ${fresh&&i.source?'fresh':''}"><button class="item-check" data-toggle="${i.id}" aria-label="${i.done?'בטל סימון':'סמן כנקנה'}: ${esc(i.name)}" aria-pressed="${!!i.done}"><span class="circle">${i.done?icon('check'):''}</span></button><div class="item-info"><strong dir="auto">${esc(i.name)}</strong>${i.qty?`<small dir="auto">${esc(i.qty)}</small>`:''}</div>${i.source&&!i.done?'<span class="source">נוסף מטקסט</span>':''}</div>`).join('')}</section>`
    }).join('')}</div><div class="app-bottom"><button class="primary" data-demo="זהו כפתור ההוספה הבודדת הקיים. נסו את כפתור הרשימה עם הפלוס בכותרת">${icon('plus')}הוסף פריט</button></div>`
  $('#import-button').onclick=()=>{opener=$('#import-button');text=sample;draft=initialDraft();draftChanged=false;showInput()}
  $('#copy-button').onclick=()=>toast('הדגמה: הרשימה הועתקה')
  document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const item=items.find(i=>i.id===b.dataset.toggle);item.done=!item.done;renderList();document.querySelector(`[data-toggle="${item.id}"]`).focus()})
  document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>toast(b.dataset.demo))
}
function baseSheet(content,kind=''){
  $('#app').inert=true
  $('#overlay').innerHTML=`<div class="veil"><section class="sheet ${kind}" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="handle" aria-hidden="true"></div>${content}</section></div>`
  const close=$('#close-sheet')
  if(close)close.onclick=requestClose
}
function heading(title,subtitle=''){return `<header class="sheet-head"><button class="icon sheet-close" id="close-sheet" aria-label="סגור">${icon('x')}</button><h2 id="sheet-title" tabindex="-1">${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</header>`}
function showInput(message='',neutral=false){
  clearTimeout(pendingTimer);screen='input';activateNav()
  baseSheet(`${heading('הוספה מטקסט','הדביקו רשימה, כתבו או הכתיבו דרך המקלדת')}<div class="sheet-body"><label for="shopping-text" class="field-label">רשימת הקניות שלכם</label><textarea id="shopping-text" class="text-input" dir="auto" placeholder="מלפפונים 6 יחידות&#10;עגבניות 4&#10;גבינה חבילה אחת">${esc(text)}</textarea><div class="hint">${icon('check')}קודם בודקים, אחר כך מוסיפים</div>${message?`<div class="notice ${neutral?'neutral-notice':''}" role="${neutral?'status':'alert'}">${esc(message)}</div>`:''}</div><footer class="sheet-footer"><button class="primary" id="parse" ${text.trim()?'':'disabled'}>${icon('import')}פענח רשימה</button></footer>`)
  $('#shopping-text').oninput=e=>{text=e.target.value;$('#parse').disabled=!text.trim()}
  $('#parse').onclick=()=>{
    if(norm(text)!==norm(sample)){
      showInput('זהו מוקאפ עם פענוח מדומה. כדי לנסות את הזרימה, חזרו לדוגמה המוכנה באמצעות ״הזנה״ בתפריט ההדגמה.',true)
      return
    }
    showLoading()
  }
  $('#shopping-text').focus({preventScroll:true})
}
function showLoading(){
  baseSheet(`${heading('הוספה מטקסט')}<div class="loading" role="status"><div class="spinner" aria-hidden="true"></div><h3>מפענח את הרשימה…</h3><p>מסדרים את השמות, הכמויות והקטגוריות</p></div>`)
  $('#close-sheet').focus()
  pendingTimer=setTimeout(()=>{draft=initialDraft();draft.forEach(syncDuplicate);draft.forEach(r=>{if(r.duplicate)r.selected=false});showReview()},850)
}
function renderRow(row){
  const cat=cats[row.cat]
  const existing=duplicateFor(row)
  let why=''
  if(row.duplicate)why=row.selected?'יתווסף כפריט נוסף':'כבר ברשימה'
  if(row.negated)why=row.selected?'יתווסף לפי הבחירה שלכם':'לא נבחר · נכתב שלא צריך'
  return `<article class="review-item ${row.selected?'':'off'}" data-row="${row.id}"><div class="review-row"><label class="choice"><input type="checkbox" data-choice="${row.id}" aria-label="הוסף ${esc(row.name)}" ${row.selected?'checked':''}></label><div class="review-info"><strong dir="auto">${esc(row.name)}</strong>${row.qty?`<span class="qty" dir="auto">${esc(row.qty)}</span>`:''}<div class="metadata"><span class="category-tag" style="background:${cat.tint};color:${cat.ink}">${cat.name}</span>${why?`<span class="why">${why}</span>`:''}</div></div><button class="icon" data-edit="${row.id}" aria-label="ערוך ${esc(row.name)}">${icon('edit')}</button></div>${existing?`<div class="duplicate-note">ברשימה: ${esc(existing.qty||'ללא כמות')}</div>`:''}
  ${editing===row.id?`<div class="row-edit"><div class="edit-grid"><div><label for="name-${row.id}">שם הפריט</label><input id="name-${row.id}" data-name="${row.id}" dir="auto" value="${esc(row.name)}" maxlength="500" required></div><div><label for="qty-${row.id}">כמות</label><input id="qty-${row.id}" data-qty="${row.id}" dir="auto" value="${esc(row.qty)}" maxlength="200"></div></div><label for="cat-${row.id}">קטגוריה</label><select id="cat-${row.id}" data-cat="${row.id}">${Object.entries(cats).map(([id,c])=>`<option value="${id}" ${id===row.cat?'selected':''}>${c.name}</option>`).join('')}</select><button class="save-edit" data-save="${row.id}">סיום עריכה</button></div>`:''}</article>`
}
function showReview(focus=true){
  screen='review';activateNav()
  const count=selectedCount()
  baseSheet(`${heading('בדיקה לפני הוספה',`${count} פריטים נבחרו להוספה`)}<div class="sheet-body review-body"><div class="batch-label">אפשר לתקן כל פריט או לבטל את הבחירה בו</div>${draft.map(renderRow).join('')}<details class="original" ${sourceOpen?'open':''}><summary>הטקסט המקורי</summary><p dir="auto">${esc(text)}</p></details></div><footer class="sheet-footer"><button class="primary" id="add-all" ${!count||draft.some(r=>r.selected&&!r.name.trim())?'disabled':''}>הוסף ${count} פריטים</button><button class="back-text" id="back-text">${icon('arrow')}חזרה לטקסט</button></footer>`,'review-sheet')
  document.querySelectorAll('[data-choice]').forEach(el=>el.onchange=()=>{
    const scroll=$('.review-body').scrollTop
    const r=draft.find(i=>i.id===Number(el.dataset.choice))
    r.selected=el.checked;draftChanged=true;showReview(false)
    $('.review-body').scrollTop=scroll
    document.querySelector(`[data-choice="${r.id}"]`).focus({preventScroll:true})
  })
  document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>{editing=Number(el.dataset.edit);showReview(false);document.querySelector(`[data-name="${editing}"]`).focus()})
  document.querySelectorAll('[data-name]').forEach(el=>el.oninput=()=>{
    const r=draft.find(i=>i.id===Number(el.dataset.name))
    el.setCustomValidity('')
    r.name=el.value;draftChanged=true
    $('#add-all').disabled=!selectedCount()||draft.some(i=>i.selected&&!i.name.trim())
  })
  document.querySelectorAll('[data-qty]').forEach(el=>el.oninput=()=>{draft.find(i=>i.id===Number(el.dataset.qty)).qty=el.value;draftChanged=true})
  document.querySelectorAll('[data-cat]').forEach(el=>el.onchange=()=>{draft.find(i=>i.id===Number(el.dataset.cat)).cat=el.value;draftChanged=true})
  document.querySelectorAll('[data-save]').forEach(el=>el.onclick=()=>{
    const id=Number(el.dataset.save),r=draft.find(i=>i.id===id)
    if(!r.name.trim()){const input=document.querySelector(`[data-name="${id}"]`);input.setCustomValidity('צריך שם לפריט');input.reportValidity();return}
    const before=r.duplicate;syncDuplicate(r);if(r.duplicate&&!before)r.selected=false
    editing=null;showReview(false);document.querySelector(`[data-edit="${id}"]`).focus()
  })
  $('.original').ontoggle=e=>{sourceOpen=e.target.open}
  $('#back-text').onclick=()=>{
    if(draftChanged)confirmAction('לחזור לטקסט?','פענוח חדש יחליף את התיקונים שעשיתם כאן.','חזרה לטקסט',()=>showInput())
    else showInput()
  }
  $('#add-all').onclick=saveBatch
  if(focus)$('#sheet-title').focus({preventScroll:true})
}
function saveBatch(){
  const selected=draft.filter(i=>i.selected&&i.name.trim())
  if(!selected.length)return
  $('#add-all').disabled=true;$('#add-all').textContent='מוסיף לרשימה…'
  $('.sheet').querySelectorAll('button,input,select').forEach(b=>b.disabled=true)
  screen='saving'
  pendingTimer=setTimeout(()=>{
    batch++
    items.push(...selected.map(r=>({id:`new-${batch}-${r.id}`,name:r.name.trim(),qty:r.qty,cat:r.cat,source:true})))
    closeSheet();screen='success';activateNav();renderList(true);$('#import-button').focus()
    toast(`נוספו ${selected.length} פריטים לרשימה`)
  },550)
}
function closeSheet(){clearTimeout(pendingTimer);$('#overlay').innerHTML='';$('#app').inert=false;screen=items.some(i=>i.source)?'success':'list';activateNav();$('#import-button')?.focus({preventScroll:true})}
function requestClose(){if(screen==='saving')return;clearTimeout(pendingTimer);if(text.trim())confirmAction('לסגור בלי להוסיף?','הטקסט והבחירות יימחקו. הרשימה שלכם לא תשתנה.','סגור',closeSheet);else closeSheet()}
function confirmAction(title,message,action,callback){
  const sheet=$('.sheet');sheet.inert=true
  const wrapper=document.createElement('div');wrapper.className='confirm-box'
  wrapper.innerHTML=`<div class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title"><h3 id="confirm-title">${esc(title)}</h3><p>${esc(message)}</p><div class="confirm-actions"><button id="confirm-yes">${esc(action)}</button><button id="confirm-no">להמשיך לערוך</button></div></div>`
  $('#overlay').append(wrapper)
  $('#confirm-no').onclick=()=>{wrapper.remove();sheet.inert=false;$('#close-sheet').focus()}
  $('#confirm-yes').onclick=()=>{wrapper.remove();callback()}
  $('#confirm-no').focus()
}
function navigate(next){
  clearTimeout(pendingTimer);clearTimeout(toastTimer);$('#feedback').innerHTML='';$('#overlay').innerHTML='';$('#app').inert=false
  editing=null;sourceOpen=false;draftChanged=false;text=sample;draft=initialDraft();items=initialItems();screen=next
  if(next==='success'){items.push(...draft.filter(i=>i.selected).map(i=>({...i,id:`demo-${i.id}`,source:true})));renderList(true);activateNav();toast('נוספו 4 פריטים לרשימה')}
  else{renderList();if(next==='input')showInput();else if(next==='review')showReview();else activateNav()}
}
document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>navigate(b.dataset.screen))
document.querySelectorAll('[data-scenario]').forEach(b=>b.onclick=()=>{
  const type=b.dataset.scenario
  if(type==='reset')navigate('list')
  if(type==='error'){navigate('input');showInput('לא הצלחנו לפענח כרגע. הטקסט נשמר, אפשר לנסות שוב')}
  if(type==='empty'){navigate('input');text='תודה רבה';showInput('לא מצאנו פריטים להוספה. נסו לכתוב שמות מוצרים וכמויות',true)}
})
document.addEventListener('keydown',e=>{
  const panel=$('.confirm-card')||$('.sheet')
  if(!panel)return
  if(e.key==='Escape'){
    e.preventDefault()
    if($('.confirm-card'))$('#confirm-no').click()
    else requestClose()
  }
  if(e.key==='Tab'){
    const controls=[...panel.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea,select:not(:disabled),summary')].filter(el=>!el.closest('[inert]'))
    if(!controls.length){e.preventDefault();return}
    const first=controls[0],last=controls.at(-1)
    if(e.shiftKey&&(document.activeElement===first||!controls.includes(document.activeElement))){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&(document.activeElement===last||!controls.includes(document.activeElement))){e.preventDefault();first.focus()}
  }
})
const requested=new URLSearchParams(location.search).get('screen')
navigate(['list','input','review','success'].includes(requested)?requested:'input')
</script>
</body>
</html>
